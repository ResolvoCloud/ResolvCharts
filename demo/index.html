<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>resolvcharts — examples</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0 auto; max-width: 1100px; padding: 24px 32px 64px;
      background: #fafafa; color: #1f1f1f;
    }
    header {
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
      padding-bottom: 16px; border-bottom: 1px solid #e5e5e5; margin-bottom: 8px;
    }
    h1 { font-size: 17px; margin: 0; }
    header p { font-size: 12px; color: #8a8a8a; margin: 0; }
    header .spacer { flex: 1; }
    label { font-size: 12px; color: #666; display: flex; gap: 6px; align-items: center; }
    select {
      font: inherit; font-size: 12px; padding: 3px 6px;
      border: 1px solid #ddd; border-radius: 6px; background: #fff;
    }
    h2 { font-size: 12px; color: #8a8a8a; font-weight: 600; text-transform: uppercase;
         letter-spacing: 0.06em; margin: 28px 0 10px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); }
    .card {
      background: #fff; border: 1px solid #e8e8e8; border-radius: 10px;
      padding: 12px 14px; min-width: 0;
    }
    h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
    details { margin-top: 10px; }
    summary { font-size: 11px; color: #999; cursor: pointer; user-select: none; }
    .card.dark { background: #0a0a0a; border-color: #222; }
    .card.dark h3 { color: #ccc; }
    .card.dark summary { color: #666; }
    .chart { height: 240px; }
    .chart.short { height: 280px; }
    .chart.spark { height: 48px; }
    pre {
      font-size: 11px; line-height: 1.5; overflow-x: auto; margin: 8px 0 0;
      background: #f6f6f6; border-radius: 6px; padding: 10px;
    }
    .card.dark pre { background: #161616; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>resolvcharts</h1>
    <p>example gallery — every card is one <code>createChart()</code> call</p>
    <div class="spacer"></div>
    <label>theme
      <select id="ui-theme">
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </label>
    <label>renderer
      <select id="ui-renderer">
        <option value="canvas">canvas</option>
        <option value="auto" selected>auto</option>
        <option value="webgpu">webgpu</option>
      </select>
    </label>
  </header>
  <main id="root"></main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
