name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push .site-out to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # root lib -> dist/ (pnpm -r skips the workspace root)
      - run: pnpm -r build # react, solid, then web/dist via astro
      - run: pnpm run docs:api # starlight docs -> site/dist (base /ResolvCharts/Docs)
      - name: Assemble site
        run: |
          mkdir -p .site-out/Docs
          cp -R web/dist/. .site-out/
          cp -R site/dist/. .site-out/Docs/
          # legacy redirects: old docs urls -> /Docs/...
          cd site/dist
          find guides api -name '*.html' | while read -r f; do
            mkdir -p "$GITHUB_WORKSPACE/.site-out/$(dirname "$f")"
            t="/ResolvCharts/Docs/${f%index.html}"
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="https://resolvocloud.github.io%s">' "$t" "$t" > "$GITHUB_WORKSPACE/.site-out/$f"
          done
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .site-out
